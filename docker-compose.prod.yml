services:
  postgres:
    image: postgres:16-alpine
    container_name: secondbrain-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secondbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-secondbrain}
    volumes:
      - secondbrain_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-secondbrain} -d ${POSTGRES_DB:-secondbrain}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - secondbrain_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secondbrain-prod-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL must be set}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL must be set}
      ALLOWED_EMAIL: ${ALLOWED_EMAIL:?ALLOWED_EMAIL must be set}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:?PASSKEY_RP_ID must be set}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME:-SecondBrain}
      PASSKEY_ORIGIN: ${PASSKEY_ORIGIN:?PASSKEY_ORIGIN must be set}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      CRON_SECRET: ${CRON_SECRET:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - secondbrain_net

volumes:
  secondbrain_prod_pgdata:

networks:
  secondbrain_net:
    driver: bridge
